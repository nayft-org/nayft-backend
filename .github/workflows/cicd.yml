name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  COMPOSE_FILE: docker-compose.prod.yml
  PROD_ENV_FILE: /nayft_storage/secrets/nayft_backend.env

jobs:
  build:
    name: Build Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate production compose file
        run: |
          echo -e "MONGO_URI=mongodb://mongodb:27017/crypto_db\nJWT_SECRET=ci-build-stub" > .env.prod.stub
          PROD_ENV_FILE="$(pwd)/.env.prod.stub" docker compose -f "$COMPOSE_FILE" config --quiet

      - name: Build backend Docker image
        run: docker compose -f "$COMPOSE_FILE" build backend

  deploy:
    name: Deploy to NAYFT (self-hosted)
    runs-on:
      - self-hosted
      - nayft-backend
    needs: build

    steps:
      # checkout@v4 tries to git clean the workspace; root-owned dirs (e.g. .backups from
      # scripts/prod-legacy-cleanup.sh or docker cp) cause EACCES and fail the deploy.
      - name: Fix workspace permissions (self-hosted)
        run: |
          set -e
          if [ -n "${GITHUB_WORKSPACE:-}" ] && [ -d "${GITHUB_WORKSPACE}" ]; then
            if [ -d "${GITHUB_WORKSPACE}/.backups" ]; then
              sudo rm -rf "${GITHUB_WORKSPACE}/.backups"
            fi
            sudo chown -R "$(whoami):$(whoami)" "${GITHUB_WORKSPACE}" || true
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare environment files and configs
        run: |
          echo "Running as: $(whoami)"
          echo "File exists: $(ls -la $PROD_ENV_FILE 2>&1)"
          # Production secrets live on the host (managed manually); compose mounts them directly.
          if [ ! -f "$PROD_ENV_FILE" ]; then
            echo "ERROR: Production secrets file not found at $PROD_ENV_FILE"
            echo "Please create this file with MONGO_URI and JWT_SECRET before deploying"
            exit 1
          fi

          if ! grep -q "MONGO_URI=" "$PROD_ENV_FILE"; then
            echo "ERROR: MONGO_URI is missing from $PROD_ENV_FILE"
            exit 1
          fi
          if ! grep -q "JWT_SECRET=" "$PROD_ENV_FILE"; then
            echo "ERROR: JWT_SECRET is missing from $PROD_ENV_FILE"
            exit 1
          fi

          # Host bind mounts for Redis/Mongo (idempotent; may require sudo on first provision)
          sudo mkdir -p /nayft_storage/redis /nayft_storage/mongodb || true

      # Self-hosted runners often run as a user that is not in the `docker` group (socket
      # permission denied). Prefer plain `docker`; if that fails, use non-interactive sudo
      # (`-n`) so CI never blocks on a password prompt—requires passwordless sudo for docker
      # on the host when the runner user cannot access the socket directly.
      - name: Resolve Docker CLI (self-hosted)
        run: |
          set -e
          if docker info &>/dev/null; then
            echo "DOCKER_WRAP=" >> "$GITHUB_ENV"
            echo "Using Docker as $(whoami) (socket access OK)"
          elif sudo -n docker info &>/dev/null; then
            echo 'DOCKER_WRAP=sudo -n ' >> "$GITHUB_ENV"
            echo "Using Docker via passwordless sudo"
          else
            echo "::error::This runner cannot access the Docker daemon."
            echo "Fix one of:"
            echo "  1) Add the runner user to the docker group, then restart the Actions Runner service:"
            echo "       sudo usermod -aG docker $(whoami)"
            echo "       sudo systemctl restart 'actions.runner.*'   # use your real runner unit name"
            echo "  2) Or configure passwordless sudo for /usr/bin/docker for this user (narrow sudoers rule)."
            exit 1
          fi

      - name: Validate production compose file
        run: ${DOCKER_WRAP}docker compose -f "$COMPOSE_FILE" config --quiet

      - name: Build backend Docker image
        run: ${DOCKER_WRAP}docker compose -f "$COMPOSE_FILE" build backend

      # Full `docker compose down` (all services) — not `down backend`. Stopping only the
      # backend can remove the project network while redis still references it, causing
      # "network ... not found" on the next `up`.
      - name: Deploy production stack
        run: |
          ${DOCKER_WRAP}docker compose -f "$COMPOSE_FILE" down --remove-orphans || true
          ${DOCKER_WRAP}docker compose -f "$COMPOSE_FILE" up -d --force-recreate

      - name: Verify deployment
        run: |
          set -e
          echo "--- compose ps ---"
          ${DOCKER_WRAP}docker compose -f "$COMPOSE_FILE" ps

          echo "--- waiting for backend health ---"
          for i in $(seq 1 30); do
            if curl -sfS http://127.0.0.1:4001/health >/dev/null; then
              echo "Backend healthy after ${i} attempt(s)"
              curl -sfS http://127.0.0.1:4001/health
              echo
              exit 0
            fi
            sleep 2
          done

          echo "::error::Backend did not become healthy within 60s"
          ${DOCKER_WRAP}docker compose -f "$COMPOSE_FILE" logs --tail=80 backend stream-worker
          exit 1
