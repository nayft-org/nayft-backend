name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  COMPOSE_FILE: docker-compose.prod.yml
  # Canonical host secrets store (read once per deploy, then copied into workspace).
  HOST_SECRETS_FILE: /nayft_storage/secrets/nayft_backend.env
  # Compose and containers consume only this workspace-local file during deploy.
  WORKSPACE_ENV_FILE: .env.production

jobs:
  build:
    name: Build Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare CI stub environment
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' \
            'MONGO_URI=mongodb://mongodb:27017/crypto_db' \
            'JWT_SECRET=ci-build-stub' \
            > "${WORKSPACE_ENV_FILE}"
          chmod 600 "${WORKSPACE_ENV_FILE}"
          ls -la "${WORKSPACE_ENV_FILE}"

      - name: Validate production compose file
        run: |
          set -euo pipefail
          docker compose -f "${COMPOSE_FILE}" config --quiet

      - name: Build backend Docker image
        run: |
          set -euo pipefail
          docker compose -f "${COMPOSE_FILE}" build backend

  deploy:
    name: Deploy to NAYFT (self-hosted)
    # Labels must match runner prod-in-nayft (self-hosted, Linux, X64).
    runs-on:
      - self-hosted
      - Linux
      - X64
    needs: build

    steps:
      # checkout@v4 tries to git clean the workspace; root-owned dirs (e.g. .backups from
      # scripts/prod-legacy-cleanup.sh or docker cp) cause EACCES and fail the deploy.
      - name: Fix workspace permissions (self-hosted)
        run: |
          set -euo pipefail
          if [[ -n "${GITHUB_WORKSPACE:-}" && -d "${GITHUB_WORKSPACE}" ]]; then
            if [[ -d "${GITHUB_WORKSPACE}/.backups" ]]; then
              sudo rm -rf "${GITHUB_WORKSPACE}/.backups"
            fi
            sudo chown -R "$(whoami):$(whoami)" "${GITHUB_WORKSPACE}" || true
          fi
          rm -f "${GITHUB_WORKSPACE:-.}/${WORKSPACE_ENV_FILE}" || true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Identify selected runner
        run: |
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "RUNNER_OS=$RUNNER_OS"
          hostname
          pgrep -af Runner.Listener

      - name: Infrastructure preflight (self-hosted)
        run: |
          set -euo pipefail
          echo "::group::Runner identity"
          whoami
          id
          pwd
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE:-<unset>}"
          echo "RUNNER_NAME=${RUNNER_NAME:-<unset>}"
          hostname -f 2>/dev/null || hostname
          echo "::endgroup::"

          echo "::group::Host secrets path (single read source)"
          printf 'HOST_SECRETS_FILE=%q\n' "${HOST_SECRETS_FILE}"
          printf '%s' "${HOST_SECRETS_FILE}" | od -An -tx1 || true
          namei -l "${HOST_SECRETS_FILE}" 2>&1 || true
          ls -la "${HOST_SECRETS_FILE}" 2>&1 || echo "direct read: not visible to runner (may use sudo fallback)"
          echo "::endgroup::"

          echo "::group::Persistent data mounts"
          mount | grep -E 'nayft|sdb' || echo "(no nayft/sdb in mount table — Redis/Mongo bind mounts may still work if paths exist)"
          df -h / "${HOST_SECRETS_FILE%/*}" 2>&1 || true
          ls -ld /nayft_storage /nayft_storage/redis /nayft_storage/mongodb 2>&1 || true
          echo "::endgroup::"

      - name: Prepare production environment
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"

          echo "::group::Copy host secrets into workspace"
          dest="${WORKSPACE_ENV_FILE}"
          src="${HOST_SECRETS_FILE}"
          rm -f "${dest}"

          copy_host_secrets() {
            if [[ -f "${src}" && -r "${src}" ]]; then
              cp -- "${src}" "${dest}"
              echo "Copied secrets using runner filesystem access."
              return 0
            fi
            if sudo -n test -r "${src}" 2>/dev/null; then
              sudo -n cp -- "${src}" "${dest}"
              sudo -n chown "$(id -u):$(id -g)" "${dest}"
              echo "Copied secrets using passwordless sudo (runner mount-namespace fallback)."
              return 0
            fi
            return 1
          }

          if ! copy_host_secrets; then
            echo "::error::Could not read host secrets at ${src}"
            echo "Ensure the file exists and either:"
            echo "  1) The runner user can read it (directory traverse + file read), or"
            echo "  2) Passwordless sudo is allowed for: test -r ${src} && cp ${src} <workspace>"
            echo ""
            echo "Runner diagnostics:"
            ls -ld "$(dirname "${src}")" 2>&1 || true
            namei -l "${src}" 2>&1 || true
            exit 1
          fi

          umask 077
          chmod 600 "${dest}"
          ls -la "${dest}"
          echo "::endgroup::"

          echo "::group::Validate workspace env file"
          for key in MONGO_URI JWT_SECRET EMAIL_PROVIDER VERIFICATION_CODE_SECRET; do
            if ! grep -qE "^${key}=" "${dest}"; then
              echo "::error::Required key ${key} is missing from ${dest}"
              exit 1
            fi
            value="$(grep -E "^${key}=" "${dest}" | tail -n1 | cut -d= -f2-)"
            if [[ -z "${value// }" ]]; then
              echo "::error::Required key ${key} is empty in ${dest}"
              exit 1
            fi
          done
          jwt_secret_value="$(grep -E '^JWT_SECRET=' "${dest}" | tail -n1 | cut -d= -f2-)"
          if [[ "${jwt_secret_value}" == "super_secret_key_change_later" ]]; then
            echo "::error::JWT_SECRET is using the insecure default value; set a real production secret."
            exit 1
          fi
          verification_secret_value="$(grep -E '^VERIFICATION_CODE_SECRET=' "${dest}" | tail -n1 | cut -d= -f2-)"
          if [[ "${verification_secret_value}" == "super_secret_key_change_later" ]]; then
            echo "::error::VERIFICATION_CODE_SECRET must not use insecure default-like values."
            exit 1
          fi
          if grep -qE '^EMAIL_PROVIDER=mailtrap$' "${dest}"; then
            for key in MAILTRAP_API_TOKEN MAILTRAP_SENDER_EMAIL; do
              value="$(grep -E "^${key}=" "${dest}" | tail -n1 | cut -d= -f2- || true)"
              if [[ -z "${value// }" ]]; then
                echo "::error::Required key ${key} is missing/empty for mailtrap provider"
                exit 1
              fi
            done
          fi
          if grep -qE '^EMAIL_STRICT_PROVIDER_VALIDATION=true$' "${dest}"; then
            email_provider_value="$(grep -E '^EMAIL_PROVIDER=' "${dest}" | tail -n1 | cut -d= -f2-)"
            if [[ "${email_provider_value}" == "noop" || "${email_provider_value}" == "mock" ]]; then
              echo "::error::EMAIL_PROVIDER=${email_provider_value} is invalid when strict provider validation is enabled."
              exit 1
            fi
          fi
          if grep -qE '^EMAIL_VERIFICATION_DEBUG_LOG=true$' "${dest}"; then
            echo "::error::EMAIL_VERIFICATION_DEBUG_LOG=true is not allowed in production."
            exit 1
          fi
          if ! grep -qE '^ADMIN_API_KEY=' "${dest}"; then
            echo "::warning::ADMIN_API_KEY is missing from ${dest}; admin routes may be unavailable."
          fi
          if grep -qE '^FRONTEND_URL=\*$' "${dest}"; then
            echo "::warning::FRONTEND_URL=* is permissive in production."
          fi
          echo "Required keys present (values not printed)."
          echo "::endgroup::"

          echo "::group::Provision persistent data directories"
          sudo mkdir -p /nayft_storage/redis /nayft_storage/mongodb
          echo "::endgroup::"

      - name: Resolve Docker CLI (self-hosted)
        run: |
          set -euo pipefail
          if docker info &>/dev/null; then
            echo "DOCKER_WRAP=" >> "${GITHUB_ENV}"
            echo "Using Docker as $(whoami) (socket access OK)"
          elif sudo -n docker info &>/dev/null; then
            echo 'DOCKER_WRAP=sudo -n ' >> "${GITHUB_ENV}"
            echo "Using Docker via passwordless sudo"
          else
            echo "::error::This runner cannot access the Docker daemon."
            echo "Fix one of:"
            echo "  1) Add the runner user to the docker group, then restart the Actions Runner service:"
            echo "       sudo usermod -aG docker $(whoami)"
            echo "       sudo systemctl restart 'actions.runner.*'"
            echo "  2) Or configure passwordless sudo for /usr/bin/docker (narrow sudoers rule)."
            exit 1
          fi

      - name: Validate production compose file
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          test -f "${WORKSPACE_ENV_FILE}"
          ls -la "${WORKSPACE_ENV_FILE}"
          ${DOCKER_WRAP}docker compose -f "${COMPOSE_FILE}" config --quiet

      - name: Build backend Docker image
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          ${DOCKER_WRAP}docker compose -f "${COMPOSE_FILE}" build backend

      - name: Deploy production stack
        id: deploy_stack
        continue-on-error: true
        run: |
          set -uo pipefail
          cd "${GITHUB_WORKSPACE}"
          # Full stack down — partial down can leave a stale project network.
          ${DOCKER_WRAP}docker compose -f "${COMPOSE_FILE}" down --remove-orphans || true

          # Containers started manually outside this compose project (e.g. for
          # ad-hoc debugging) keep the same fixed names and aren't removed by
          # `down` above, which makes `up --force-recreate` fail with
          # "Conflict. The container name ... is already in use". Force-remove
          # any leftovers by name before recreating the stack.
          for name in crypto-redis crypto-mongo crypto-backend crypto-stream-worker; do
            ${DOCKER_WRAP}docker rm -f "${name}" >/dev/null 2>&1 || true
          done

          deploy_exit_code=0
          ${DOCKER_WRAP}docker compose -f "${COMPOSE_FILE}" up -d --force-recreate || deploy_exit_code=$?
          echo "deploy_exit_code=${deploy_exit_code}" >> "${GITHUB_OUTPUT}"
          if [[ "${deploy_exit_code}" -ne 0 ]]; then
            echo "::warning::Deploy command failed with exit code ${deploy_exit_code}; running diagnostics."
          fi

      - name: Verify deployment and collect diagnostics
        id: verify_and_diagnose
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          DIAG_DIR="${GITHUB_WORKSPACE}/deploy-diagnostics"
          mkdir -p "${DIAG_DIR}"
          DEPLOY_EXIT_CODE="${{ steps.deploy_stack.outputs.deploy_exit_code }}"
          DEPLOY_EXIT_CODE="${DEPLOY_EXIT_CODE:-1}"
          echo "deploy_exit_code=${DEPLOY_EXIT_CODE}" | tee "${DIAG_DIR}/deploy-status.txt"
          echo "=============================="
          echo "DOCKER COMPOSE PS"
          echo "=============================="
          ${DOCKER_WRAP}docker compose -f "${COMPOSE_FILE}" ps | tee "${DIAG_DIR}/compose-ps.txt"

          echo "=============================="
          echo "READINESS RETRY LOOP"
          echo "=============================="
          ready_ok=0
          max_attempts=30
          attempt_interval_sec=2
          for i in $(seq 1 "${max_attempts}"); do
            status_code="$(curl -sS -o /tmp/backend-ready.json -w '%{http_code}' http://127.0.0.1:4001/ready || true)"
            if [[ "${status_code}" == "200" ]]; then
              echo "Readiness check attempt ${i}/${max_attempts}: HTTP ${status_code} (ready)"
              echo "FULL /ready RESPONSE:"
              cat /tmp/backend-ready.json
              cat /tmp/backend-ready.json > "${DIAG_DIR}/ready-final.json"
              ready_ok=1
              break
            fi
            echo "Readiness check attempt ${i}/${max_attempts}: HTTP ${status_code} (not ready)"
            if [[ -s /tmp/backend-ready.json ]]; then
              if command -v python3 >/dev/null 2>&1; then
                python3 "${GITHUB_WORKSPACE}/scripts/ci/readiness-attempt-summary.py" || true
              else
                echo "Readiness parser unavailable (python3 missing); using raw payload."
              fi
            fi
            {
              echo "attempt=${i}/${max_attempts} status=${status_code} ts=$(date -Is)"
              [[ -s /tmp/backend-ready.json ]] && cat /tmp/backend-ready.json
              echo
            } >> "${DIAG_DIR}/ready-attempts.log"
            if [[ -s /tmp/backend-ready.json ]]; then
              echo "FULL /ready RESPONSE:"
              cat /tmp/backend-ready.json
            fi
            if (( i % 5 == 0 )); then
              echo "=============================="
              echo "DOCKER HEALTH HISTORY SNAPSHOT"
              echo "=============================="
              ${DOCKER_WRAP}docker inspect crypto-backend --format '{{json .State.Health}}' \
                | tee -a "${DIAG_DIR}/backend-health-inspect.log" || true
              ${DOCKER_WRAP}docker inspect crypto-stream-worker --format '{{json .State.Health}}' \
                | tee -a "${DIAG_DIR}/stream-worker-health-inspect.log" || true
              echo "=============================="
              echo "BACKEND LOGS SNAPSHOT (TAIL 200)"
              echo "=============================="
              ${DOCKER_WRAP}docker compose -f "${COMPOSE_FILE}" logs --tail=200 backend \
                | tee -a "${DIAG_DIR}/backend-tail.log" || true
              echo "=============================="
              echo "WORKER LOGS SNAPSHOT (TAIL 200)"
              echo "=============================="
              ${DOCKER_WRAP}docker compose -f "${COMPOSE_FILE}" logs --tail=200 stream-worker \
                | tee -a "${DIAG_DIR}/stream-worker-tail.log" || true
            fi
            if [[ "${i}" -eq "${max_attempts}" ]]; then
              echo "Readiness timeout reached after ${max_attempts} attempts at ${attempt_interval_sec}s interval."
            fi
            sleep "${attempt_interval_sec}"
          done

          if [[ ! -f /tmp/backend-ready.json ]]; then
            echo '{}' > /tmp/backend-ready.json
          fi
          if command -v python3 >/dev/null 2>&1; then
            python3 "${GITHUB_WORKSPACE}/scripts/ci/readiness-classification.py" | tee "${DIAG_DIR}/readiness-classification.txt"
          else
            echo "==============================" | tee "${DIAG_DIR}/readiness-classification.txt"
            echo "READINESS FAILURE CLASSIFICATION" | tee -a "${DIAG_DIR}/readiness-classification.txt"
            echo "==============================" | tee -a "${DIAG_DIR}/readiness-classification.txt"
            echo "python3 not available; showing raw /ready payload only." | tee -a "${DIAG_DIR}/readiness-classification.txt"
          fi

          if [[ "${ready_ok}" -eq 1 ]]; then
            echo "READY_OK=1" | tee -a "${DIAG_DIR}/deploy-status.txt"
          else
            echo "::error::Backend did not become healthy within readiness window"
            echo "READY_OK=0" | tee -a "${DIAG_DIR}/deploy-status.txt"
          fi

          echo "=============================="
          echo "READINESS RESPONSE (RAW)"
          echo "=============================="
          cat /tmp/backend-ready.json | tee "${DIAG_DIR}/ready-final.json"

          echo "=============================="
          echo "DOCKER HEALTH HISTORY (RAW)"
          echo "=============================="
          ${DOCKER_WRAP}docker inspect crypto-backend --format '{{json .State.Health}}' \
            | tee "${DIAG_DIR}/backend-health-inspect.log" || true
          ${DOCKER_WRAP}docker inspect crypto-stream-worker --format '{{json .State.Health}}' \
            | tee "${DIAG_DIR}/stream-worker-health-inspect.log" || true

          echo "=============================="
          echo "BACKEND LOGS (TAIL 200)"
          echo "=============================="
          ${DOCKER_WRAP}docker compose -f "${COMPOSE_FILE}" logs --tail=200 backend \
            | tee "${DIAG_DIR}/backend-logs-tail200.txt" || true

          echo "=============================="
          echo "WORKER LOGS (TAIL 200)"
          echo "=============================="
          ${DOCKER_WRAP}docker compose -f "${COMPOSE_FILE}" logs --tail=200 stream-worker \
            | tee "${DIAG_DIR}/stream-worker-logs-tail200.txt" || true

          echo "=============================="
          echo "FINAL CONTAINER STATE"
          echo "=============================="
          ${DOCKER_WRAP}docker inspect crypto-backend --format '{{json .State}}' \
            | tee "${DIAG_DIR}/backend-state.json" || true
          ${DOCKER_WRAP}docker inspect crypto-stream-worker --format '{{json .State}}' \
            | tee "${DIAG_DIR}/stream-worker-state.json" || true

          echo "=============================="
          echo "DOCKER STATS SNAPSHOT"
          echo "=============================="
          ${DOCKER_WRAP}docker stats --no-stream | tee "${DIAG_DIR}/docker-stats.txt" || true

          echo "=============================="
          echo "DOCKER COMPOSE PS (FINAL)"
          echo "=============================="
          ${DOCKER_WRAP}docker compose -f "${COMPOSE_FILE}" ps | tee "${DIAG_DIR}/compose-ps-final.txt" || true

          # Allow buffered logs to flush before step exits.
          sleep 2
          if [[ "${DEPLOY_EXIT_CODE}" -ne 0 || "${ready_ok}" -ne 1 ]]; then
            exit 1
          fi

      - name: Upload deployment diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-diagnostics-${{ github.run_id }}
          path: ${{ github.workspace }}/deploy-diagnostics
          retention-days: 14

      - name: Final deployment result
        if: always()
        run: |
          set -euo pipefail
          deploy_exit_code="${{ steps.deploy_stack.outputs.deploy_exit_code }}"
          deploy_exit_code="${deploy_exit_code:-1}"
          verify_outcome="${{ steps.verify_and_diagnose.outcome }}"
          if [[ "${deploy_exit_code}" != "0" ]]; then
            echo "::error::Deploy command failed with exit code ${deploy_exit_code}"
            exit 1
          fi
          if [[ "${verify_outcome}" != "success" ]]; then
            echo "::error::Deployment diagnostics indicate backend was not ready."
            exit 1
          fi

      - name: Cleanup workspace secrets
        if: always()
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          if [[ -f "${WORKSPACE_ENV_FILE}" ]]; then
            shred -u "${WORKSPACE_ENV_FILE}" 2>/dev/null || rm -f "${WORKSPACE_ENV_FILE}"
            echo "Removed ${WORKSPACE_ENV_FILE} from workspace."
          fi
