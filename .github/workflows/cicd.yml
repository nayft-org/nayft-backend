name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker compose -f docker-compose.yml build backend

  deploy:
    name: Deploy to NAYFT (self-hosted)
    runs-on:
      - self-hosted
      - nayft-backend
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare environment files and configs
        run: |
          # Backend env - copy from server (managed manually)
          if [ -f /nayft/secrets/nayft_backend ]; then
            cp /nayft/secrets/nayft_backend ./.env
            # Validate that required backend environment variables are present
            if ! grep -q "MONGO_URI=" ./.env; then
              echo "ERROR: MONGO_URI is missing from nayft_backend secrets file"
              echo "Please ensure /nayft/secrets/nayft_backend contains MONGO_URI"
              exit 1
            fi
            if ! grep -q "JWT_SECRET=" ./.env; then
              echo "ERROR: JWT_SECRET is missing from nayft_backend secrets file"
              echo "Please ensure /nayft/secrets/nayft_backend contains JWT_SECRET"
              exit 1
            fi
          else
            echo "ERROR: Backend .env file not found at /nayft/secrets/nayft_backend"
            echo "Please create this file with MONGO_URI and JWT_SECRET before deploying"
            exit 1
          fi

      - name: Build backend Docker image
        run: |
          sudo docker compose -f docker-compose.yml build backend

      - name: Deploy backend
        run: |
          sudo docker compose down backend || true
          sudo docker compose up -d backend
