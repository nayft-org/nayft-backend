name: PI Golden Fixtures

on:
  pull_request:
    paths:
      - 'src/modules/portfolio-intelligence/engines/**'
      - 'src/modules/portfolio-intelligence/formulas/**'
      - 'src/modules/portfolio-intelligence/config/piFormulaRegistry.ts'
      - 'scripts/pi-replay-certify.ts'
  push:
    branches:
      - main
    paths:
      - 'src/modules/portfolio-intelligence/engines/**'
      - 'src/modules/portfolio-intelligence/formulas/**'

jobs:
  pi-replay-certify:
    name: pi:replay:certify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run pi:replay:certify
      - run: npm test -- --testPathPatterns="portfolio-intelligence/engines"
