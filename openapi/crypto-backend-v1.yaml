        heldCoinIds: { type: array, items: { type: string } }
        weightBySymbol: { type: object, additionalProperties: { type: number } }
        ingestRevision: { type: integer }
        analyticsRevision: { type: integer }
        stale: { type: boolean }
        staleMapping: { type: boolean }
        narrativeVector: { type: object, additionalProperties: { type: number } }
        convictionVector: { type: object, additionalProperties: { type: number } }
        topThemes: { type: array, items: { type: string } }
