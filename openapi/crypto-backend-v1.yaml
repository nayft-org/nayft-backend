                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          enabled: { type: boolean }
                          buildEnabled: { type: boolean }
                          apiEnabled: { type: boolean }
                          shadowMode: { type: boolean }
                          lastBuildDurationMs: { type: integer }
                          lastRevision: { type: integer }
                          lastBuildAt: { type: string }
                          universeSize: { type: integer }
                          buildSkippedOverlapTotal: { type: integer }
                          buildFailedTotal: { type: integer }
                          buildValidationFailedTotal: { type: integer }
                          manifestComplete: { type: boolean }
                          manifestRevision: { type: integer, nullable: true }

  /api/admin/risk/recalculate:
    post:
      tags: [Admin]
      summary: Trigger a full synchronous risk build
      description: Freezes universe, computes factors, normalizes, composes CRS, publishes snapshot, writes history/regimes, emits alerts.
      security: [{ adminApiKey: [] }]
      responses:
        '200':
          description: Build result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      ok: { type: boolean }
                      buildId: { type: string }
                      revision: { type: integer }
                      error: { type: string }
                      skipped: { type: boolean }

  /api/admin/risk/replay:
    post:
      tags: [Admin]
      summary: Replay a historical risk build in an isolated namespace
      description: Never touches production revision; records a job in RiskRecalcJob.
      security: [{ adminApiKey: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [sourceBuildId]
              properties: { sourceBuildId: { type: string } }
      parameters:
        - { name: sourceBuildId, in: query, required: false, schema: { type: string }, description: Alternative to body field }
      responses:
        '200':
          description: Replay result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      ok: { type: boolean }
                      replayId: { type: string }
                      buildId: { type: string }
                      error: { type: string }
                      diffSummary: { type: object, properties: { coinCount: { type: integer } } }
        '400': { description: sourceBuildId required }

  /api/admin/risk/builds/{buildId}:
    get:
      tags: [Admin]
      summary: Get a frozen build universe and raw factor row count
      security: [{ adminApiKey: [] }]
      parameters:
        - { name: buildId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          universe: { type: object }
                          factorRawCount: { type: integer }
        '404': { description: build_not_found }

  /api/admin/sentiment/health:
    get:
      tags: [Admin]
      summary: Sentiment pipeline health
      description: Redis stream/DLQ depths, job counters, worker failure rate, article readiness ratio, active alerts.
      security: [{ adminApiKey: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          enrichmentEnabled: { type: boolean }
                          workerEnabled: { type: boolean }
                          apiEnabled: { type: boolean }
                          queueDepth: { type: integer }
                          dlqDepth: { type: integer }
                          jobsEnqueuedTotal: { type: integer }
                          jobsProcessedTotal: { type: integer }
                          jobsFailedTotal: { type: integer }
                          jobsSkippedTotal: { type: integer }
                          backpressureSkipsTotal: { type: integer }
                          queueLagMs: { type: integer }
                          workerFailureRate: { type: number }
                          averageScoringMs: { type: number }
                          aggregationDurationMs: { type: number }
                          lastAggregationAt: { type: string }
                          articlesReadyRatio: { type: number }
                          processingStaleCount: { type: integer }
                          alerts: { type: array, items: { type: object } }

  /api/admin/sentiment/reprocess:
    post:
      tags: [Admin]
      summary: Reprocess recent articles' sentiment
      description: Either inline-forced re-enrichment, or enqueues jobs to the sentiment queue.
      security: [{ adminApiKey: [] }]
      parameters:
        - { name: days, in: query, required: false, schema: { type: integer, default: 90, minimum: 1, maximum: 365 } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 500, maximum: 100 } }
        - { name: force, in: query, required: false, schema: { type: string, enum: ['true', 'false'], default: 'false' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          mode: { type: string, enum: [inline_force, queue] }
                          processed: { type: integer, description: Present when mode=inline_force }
                          enqueued: { type: integer, description: Present when mode=queue }

  /api/admin/sentiment/aggregate:
    post:
      tags: [Admin]
      summary: Run the coin-level sentiment aggregation job synchronously
      security: [{ adminApiKey: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties: { data: { type: object } }

  # ============================================================
  # PUBLIC
  # ============================================================
  /api/features:
    get:
      tags: [Public]
      summary: List active feature keys
      description: For hasFeature() checks on the frontend.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties: { features: { type: array, items: { type: string } } }

  /api/public/runtime-hints:
    get:
      tags: [Public]
      summary: Lightweight runtime hints for mobile clients
      description: Min app version, WS protocol requirement, analytics acceptance, schema enforcement mode. No secrets.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          minAppVersion: { type: string }
                          clientAnalyticsServerAccept: { type: boolean }
                          wsProtocolV2Required: { type: boolean }
                          eventsSchemaEnforcement: { type: string, enum: [off, log, enforce] }

  /api/events:
    post:
      tags: [Public]
      summary: Ingest a client analytics event
      description: >
        Rate limited (100/min/IP). Validated via zod + registry check; pushed to a Redis queue with a
        direct-DB-write fallback. Gated by the events_ingest_enabled and client_analytics_server_accept
        runtime switches.
      security: [{}, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [featureKey, eventType]
              properties:
                featureKey: { type: string, minLength: 1, maxLength: 64 }
                eventType: { type: string, minLength: 1, maxLength: 64 }
                metadata: { type: object, description: "Max 10 keys; key length <=32; values string(<=200)/number/boolean/null" }
                preValidated: { type: boolean }
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties: { data: { type: object, properties: { ok: { type: boolean, example: true } } } }
        '400': { description: Zod validation error }
        '422': { description: Event failed registry/schema validation }
        '429': { description: Too many requests }
        '503': { description: Event ingestion temporarily unavailable }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Standard user auth. Some endpoints accept it optionally (optionalAuth) to personalize public responses.
    adminApiKey:
      type: apiKey
      in: header
      name: x-admin-key
      description: Must match the server's ADMIN_API_KEY env var. Returns 501 if unconfigured, 401 if mismatched.
    ingestKey:
      type: apiKey
      in: header
      name: x-ingest-key
      description: Shared secret for the news ingestion trigger endpoint.

  schemas:
    ApiResponse:
      type: object
      description: Standard envelope used by nearly every endpoint in this API.
      required: [success]
      properties:
        success: { type: boolean }
        data: {}
        error: { type: string, nullable: true }

    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        error: { type: string }

    ReadinessReport:
      type: object
      properties:
        status: { type: string, enum: [ready, unhealthy] }
        phase: { type: string }
        failureCategory:
          type: string
          enum: [READY, READINESS_MONGO_FAILED, READINESS_REDIS_FAILED, READINESS_EMAIL_RUNTIME_FAILED, READINESS_WORKER_HEARTBEAT_FAILED, READINESS_BOOT_FAILED]
        reason: { type: string }
        startupElapsedMs: { type: integer }
        readinessCheckMs: { type: integer }
        traceId: { type: string }
        timestamp: { type: string, format: date-time }
        bootFailure: { type: object, nullable: true }
        boot: { type: object }
        redis: { type: object }
        checks: { type: object }
        worker: { type: object }

    User:
      type: object
      description: Sanitized user document (passwordHash never serialized).
      properties:
        id: { type: string }
        email: { type: string, format: email }
        username: { type: string }
        followingCoins: { type: array, items: { type: string } }
        rewardPoints: { type: integer }
        preferredLanguage: { type: string, nullable: true }
        emailVerified: { type: boolean }
        emailVerifiedAt: { type: string, format: date-time, nullable: true }
        coinOnboardingCompleted: { type: boolean }
        personalizationEnabled: { type: boolean }
        analyticsConsent: { type: boolean }
        createdAt: { type: string, format: date-time }

    UserExportBundle:
      type: object
      properties:
        exportedAt: { type: string, format: date-time }
        schemaVersion: { type: integer, example: 1 }
        user: { type: object }
        wallets: { type: array, items: { type: object } }
        walletEvents: { type: array, items: { type: object } }
        holdings: { type: array, items: { type: object } }
        exchangeConnections: { type: array, items: { type: object } }
        follows: { type: array, items: { type: object } }
        wishlist: { type: array, items: { type: object } }
        rewards: { type: array, items: { type: object } }
        newsBoards: { type: array, items: { type: object } }
        reactions: { type: array, items: { type: object } }
        comments: { type: array, items: { type: object } }
        notifications: { type: array, items: { type: object } }
        notificationPreferences: { type: object, nullable: true }
        analyticsEvents: { type: array, items: { type: object } }

    FollowActionResult:
      type: object
      properties:
        followed: { type: boolean }
        targetType: { type: string, enum: [coin, user] }
        targetId: { type: string }
        followersCount: { type: integer }

    FollowedCoin:
      type: object
      properties:
        coinId: { type: string }
        symbol: { type: string }
        name: { type: string }
        rank: { type: integer }
        price: { type: number }
        percentChange24h: { type: number }
        followersCount: { type: integer }
        image: { type: string }
        marketCapRank: { type: integer }

    FollowedUser:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        followersCount: { type: integer }

    Follower:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        followedAt: { type: string, format: date-time }

    WishlistCoin:
      type: object
      properties:
        coinId: { type: string }
        symbol: { type: string }
        name: { type: string }
        price: { type: number }
        percentChange24h: { type: number }
        rank: { type: integer }

    RewardsSummary:
      type: object
      properties:
        totalPoints: { type: integer }
        activities:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              action: { type: string }
              points: { type: integer }
              createdAt: { type: string, format: date-time }

    StoreNewsResult:
      type: object
      properties:
        fetched: { type: integer }
        stored: { type: integer }
        skipped: { type: integer }
        inserted: { type: integer }
        updated: { type: integer }

    ReactionType:
      type: string
      enum: [appreciate, insightful, bullish, risk, deepDive, debatable]

    ReactionCounts:
      type: object
      properties:
        appreciate: { type: integer }
        insightful: { type: integer }
        bullish: { type: integer }
        risk: { type: integer }
        deepDive: { type: integer }
        debatable: { type: integer }
        total: { type: integer }

    NewsShareMeta:
      type: object
      properties:
        shareUrl: { type: string }
        publisherUrl: { type: string }
        ogImageUrl: { type: string, nullable: true }

    NewsArticle:
      type: object
      properties:
        id: { type: string, description: externalId }
        title: { type: string }
        summary: { type: string }
        subtitle: { type: string }
        source: { type: string }
        sourceUrl: { type: string }
        url: { type: string }
        image: { type: string }
        sourceInfo:
          type: object
          properties:
            sourceKey: { type: string }
            name: { type: string }
            domain: { type: string }
            logoUrl: { type: string, nullable: true }
            trustCategory: { type: string }
        shareMeta: { $ref: '#/components/schemas/NewsShareMeta' }
        relatedCoins: { type: array, items: { type: string } }
        categories:
          type: array
          items:
            type: object
            properties: { key: { type: string }, name: { type: string } }
        publishedAt: { type: string, format: date-time }
        saveCount: { type: integer }
        comments: { type: integer }
        reactions: { $ref: '#/components/schemas/ReactionCounts' }
        userReaction: { $ref: '#/components/schemas/ReactionType' }
        sentiment: { type: string, description: Present only when sentimentStatus=ready }
        sentimentScore: { type: number, description: Present only when sentimentStatus=ready }

    NewsBoard:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        newsIds: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }

    Mention:
      type: object
      properties:
        userId: { type: string }
        username: { type: string }
        offset: { type: integer }
        length: { type: integer }

    Comment:
      type: object
      properties:
        id: { type: string }
        newsId: { type: string }
        userId: { type: string }
        username: { type: string }
        parentId: { type: string, nullable: true }
        body: { type: string }
        mentions: { type: array, items: { $ref: '#/components/schemas/Mention' } }
        replyCount: { type: integer }
        createdAt: { type: string, format: date-time }

    UnifiedSearchResult:
      type: object
      properties:
        results:
          type: object
          properties:
            coins: { type: array, items: { $ref: '#/components/schemas/CoinProfile' } }
            news: { type: array, items: { type: object } }
            users: { type: array, items: { type: object, properties: { id: { type: string }, username: { type: string } } } }
            newsBoards: { type: array, items: { type: object } }
            portfolioAssets: { type: array, items: { type: object } }
        meta:
          type: object
          properties:
            tookMs: { type: integer }
            query: { type: string }
            segments: { type: array, items: { type: string } }
            partialFailures: { type: array, items: { type: string } }
            nextCursor: { type: string }
            segmentStatus: { type: object }
            segmentTookMs: { type: object }
            cacheHit: { type: boolean }
            degraded: { type: boolean }

    CoinProfile:
      type: object
      properties:
        internalCoinId: { type: string }
        coinId: { type: string }
        symbol: { type: string }
        name: { type: string }
        rank: { type: integer }
        price: { type: number }
        percentChange24h: { type: number }
        marketCap: { type: number }
        volume24h: { type: number }
        image: { type: string }
        marketCapRank: { type: integer }

    CoinStats:
      type: object
      properties:
        internalCoinId: { type: string }
        coinId: { type: string }
        image: { type: string }
        current_price: { type: number }
        market_cap: { type: number }
        market_cap_rank: { type: integer }
        fully_diluted_valuation: { type: number }
        total_volume: { type: number }
        high_24h: { type: number }
        low_24h: { type: number }
        circulating_supply: { type: number }
        total_supply: { type: number }
        max_supply: { type: number, nullable: true }
        ath: { type: number }
        ath_date: { type: string }
        atl: { type: number }
        atl_date: { type: string }
        contract_address: { type: string, nullable: true }

    IngestResult:
