openapi: 3.0.3
info:
  title: NAYFT Crypto Backend API
  description: >
    Full HTTP API surface of the NAYFT crypto-backend service (Node.js / TypeScript / Express / MongoDB).
    Covers authentication, user/social graph, news & content, market data & charts, portfolio tracking,
    the Portfolio Intelligence engine, risk scoring, sentiment, notifications, and admin/ops tooling.
    Unless noted otherwise, every response is wrapped in the standard envelope:
    `{ success: boolean, data?: T, error?: string | null }`.
  version: 1.0.0
servers:
  - url: /
    description: Same-origin (API is mounted under /api on the backend host)
tags:
  - name: System
    description: Liveness/readiness probes (not under /api)
  - name: Auth
    description: Signup, login, verification, password management
  - name: User
    description: Profile, preferences, data export, account deletion
  - name: Onboarding
    description: First-run coin selection flow
  - name: Follow
    description: Follow graph for coins and users
  - name: Wishlist
    description: Legacy coin wishlist (mirrors coin-follow)
  - name: Rewards
    description: Gamified reward points
  - name: News
    description: News feed, article detail, ingestion, sentiment
  - name: NewsBoards
    description: User-curated saved-article boards
  - name: Comments
    description: Threaded comments on articles
  - name: Reactions
    description: Emoji-style reactions on articles
  - name: Search
    description: Unified cross-entity search
  - name: Coins
    description: Coin catalog, stats, ingestion/population jobs
  - name: Market
    description: Market snapshots, trending, gainers/losers, active coins
  - name: Charts
    description: OHLCV klines, trades, market-cap trend index
  - name: Portfolio
    description: Wallet & exchange tracking, holdings, on-chain webhooks
  - name: Portfolio Intelligence
    description: Portfolio analytics engine (health, risk, identity, narrative, AI analyst, simulation)
  - name: Interest Profile
    description: Behavioral + portfolio-derived interest modeling for personalization
  - name: Feed Ranking
    description: Server-side personalized article ranking
  - name: Risk
    description: Public coin risk scoring (CRS) API
  - name: Notifications
    description: In-app notifications, preferences, device push sessions
  - name: Admin
    description: Admin-only operational and governance endpoints (x-admin-key)
  - name: Public
    description: Public config/feature endpoints
  - name: Metrics
    description: Operational metrics snapshot (admin-only)

security: []

paths:
  # ============================================================
  # SYSTEM
  # ============================================================
  /health:
    get:
      tags: [System]
      summary: Liveness probe
      description: Trivial liveness check, always returns ok if the process is up.
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  timestamp: { type: string, format: date-time }

  /ready:
    get:
      tags: [System]
      summary: Readiness probe
      description: >
        Checks MongoDB connection, Redis ping, email runtime config validity (when required),
        email worker heartbeat (when required), and boot-trace failure state. Returns 503 when unhealthy.
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessReport' }
        '503':
          description: Service is not ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessReport' }

  # ============================================================
  # AUTH
  # ============================================================
  /api/auth/signup:
    post:
      tags: [Auth]
      summary: Register a new user
      description: >
        Rate limited (10/min/IP). Creates a user with hashed password, enforces password-strength
        policy, sends an email verification code, and returns a JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, username, password]
              properties:
                email: { type: string, format: email }
                username: { type: string, minLength: 3 }
                password: { type: string, description: Must satisfy zxcvbn-based strength policy }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user: { $ref: '#/components/schemas/User' }
                          token: { type: string }
                          emailDeliveryStatus: { type: string, enum: [queued, skipped, failed] }
        '400':
          description: Validation error, duplicate email/username, or password policy violation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: Too many auth attempts (rate limited)

  /api/auth/password-policy:
    get:
      tags: [Auth]
      summary: Get password policy constants
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          minLength: { type: integer }
                          maxLength: { type: integer }
                          minZxcvbnScore: { type: integer }
                          recommendedLength: { type: integer }
                          minimumLevel: { type: string, example: strong }

  /api/auth/change-password:
    post:
      tags: [Auth]
      summary: Change the authenticated user's password
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string }
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '400':
          description: Validation error, incorrect current password, or weak new password
        '401':
          description: Unauthenticated

  /api/auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password via token (not yet implemented)
      description: Currently always returns an error — feature is not available yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, newPassword]
              properties:
                token: { type: string }
                email: { type: string, format: email }
                newPassword: { type: string }
      responses:
        '400':
          description: "Password reset is not yet available"

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user: { $ref: '#/components/schemas/User' }
                          token: { type: string }
        '400':
          description: Validation error
        '401':
          description: Invalid email or password

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user: { $ref: '#/components/schemas/User' }
        '401': { description: Unauthenticated }
        '404': { description: User not found }

  /api/auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify email with a 6-digit code
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Email verified; returns a fresh JWT with emailVerified=true
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user: { $ref: '#/components/schemas/User' }
                          token: { type: string }
        '400': { description: "VERIFICATION_CODE_INVALID" }
        '410': { description: "VERIFICATION_CODE_EXPIRED" }
        '429': { description: "VERIFICATION_LOCKED" }

  /api/auth/resend-verification:
    post:
      tags: [Auth]
      summary: Resend the email verification code
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Code resent
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message: { type: string }
                          expiresAt: { type: string, format: date-time }
                          emailDeliveryStatus: { type: string, enum: [queued, skipped] }
        '400': { description: "ALREADY_VERIFIED or other error" }
        '429': { description: "VERIFICATION_RESEND_COOLDOWN or VERIFICATION_RESEND_LIMIT" }

  /api/auth/verification-status:
    get:
      tags: [Auth]
      summary: Get email verification status and cooldown
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          emailVerified: { type: boolean }
                          canResend: { type: boolean }
                          cooldownSecondsRemaining: { type: integer }
                          codeExpiresAt: { type: string, format: date-time, nullable: true }
                          locked: { type: boolean }

  /api/auth/google:
    post:
      tags: [Auth]
      summary: Sign in / sign up with Google ID token
      description: Rate limited. Verifies the Google ID token, finds or auto-creates a user, issues a JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken: { type: string }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user: { $ref: '#/components/schemas/User' }
                          token: { type: string }
        '401': { description: Invalid Google token or missing email in payload }

  # ============================================================
  # USER
  # ============================================================
  /api/user/me/export:
    get:
      tags: [User]
      summary: Export all of the current user's data
      description: >
        Requires a verified email. Returns a downloadable JSON bundle of wallets, holdings, follows,
        wishlist, rewards, boards, reactions, comments, notifications and analytics events.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Export bundle (application/json attachment)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserExportBundle' }
        '403': { description: "EMAIL_NOT_VERIFIED: Email verification required" }
        '404': { description: User not found or export failure }

  /api/user/preferences:
    get:
      tags: [User]
      summary: Get user preferences
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          preferredLanguage: { type: string, nullable: true }
                          personalizationEnabled: { type: boolean }
    patch:
      tags: [User]
      summary: Update user preferences
      description: Updating preferredLanguage re-issues a JWT that embeds the new language claim.
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                preferredLanguage: { type: string, description: Must be a supported language code }
                personalizationEnabled: { type: boolean }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          preferredLanguage: { type: string }
                          personalizationEnabled: { type: boolean }
                          token: { type: string, description: Present only when language changed }
        '400': { description: "No preferences to update / Unsupported language" }

  /api/user/search:
    get:
      tags: [User]
      summary: Search users by username
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 5, maximum: 10 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          users:
                            type: array
                            items:
                              type: object
                              properties:
                                id: { type: string }
                                username: { type: string }
        '400': { description: Search query is required }
        '403': { description: Email not verified }

  /api/user/follow/{coinId}:
    post:
      tags: [User]
      summary: Toggle follow/unfollow for a coin (legacy)
      description: Follows the coin if not already following, otherwise unfollows. Syncs legacy followingCoins array.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: coinId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message: { type: string, enum: ["Coin followed", "Coin unfollowed"] }
                          following: { type: boolean }

  /api/user/me:
    delete:
      tags: [User]
      summary: Delete the current user's account
      description: Permanently deletes the account and all associated data.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          deleted: { type: boolean, example: true }
        '404': { description: User not found }

  # ============================================================
  # ONBOARDING
  # ============================================================
  /api/onboarding/complete:
    post:
      tags: [Onboarding]
      summary: Complete coin onboarding
      description: >
        Follows at least 5 distinct coins and marks coinOnboardingCompleted=true. Idempotent if already
        completed.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [coinIds]
              properties:
                coinIds:
                  type: array
                  items: { type: string }
                  description: Must resolve to at least 5 distinct canonical coin ids
      responses:
        '200':
          description: Onboarding completed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user: { $ref: '#/components/schemas/User' }
        '400': { description: "coinIds must be an array / Select at least 5 distinct coins" }
        '403': { description: Email not verified }

  # ============================================================
  # FOLLOW
  # ============================================================
  /api/follow/coins/{coinId}:
    post:
      tags: [Follow]
      summary: Follow a coin
      description: Resolves coinId/symbol/internalId to a canonical id, upserts follow, triggers interest-profile recompute.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: coinId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/FollowActionResult' } }
        '400': { description: Coin not found }
    delete:
      tags: [Follow]
      summary: Unfollow a coin
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: coinId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/FollowActionResult' } }

  /api/follow/coins:
    get:
      tags: [Follow]
      summary: List coins the current user follows
      description: Enriched with live snapshot data (price, rank, image, etc).
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          coins:
                            type: array
                            items: { $ref: '#/components/schemas/FollowedCoin' }

  /api/follow/coins/{coinId}/followers:
    get:
      tags: [Follow]
      summary: List followers of a coin
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: coinId, in: path, required: true, schema: { type: string } }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          followers:
                            type: array
                            items: { $ref: '#/components/schemas/Follower' }

  /api/follow/coins/{coinId}/stats:
    get:
      tags: [Follow]
      summary: Get follower count for a coin
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: coinId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          coinId: { type: string }
                          followersCount: { type: integer }

  /api/follow/users/{userId}:
    post:
      tags: [Follow]
      summary: Follow a user
      description: Cannot follow self; publishes a new-follower notification event.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/FollowActionResult' } }
        '400': { description: "You cannot follow yourself / User not found" }
    delete:
      tags: [Follow]
      summary: Unfollow a user
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/FollowActionResult' } }

  /api/follow/users:
    get:
      tags: [Follow]
      summary: List users the current user follows
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          users:
                            type: array
                            items: { $ref: '#/components/schemas/FollowedUser' }

  /api/follow/users/{userId}/followers:
    get:
      tags: [Follow]
      summary: List a target user's followers
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          followers:
                            type: array
                            items: { $ref: '#/components/schemas/Follower' }

  /api/follow/users/{userId}/stats:
    get:
      tags: [Follow]
      summary: Get follow stats for a user
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          userId: { type: string }
                          followersCount: { type: integer }
                          followingUsersCount: { type: integer }
                          followingCoinsCount: { type: integer }
        '404': { description: User not found }

  # ============================================================
  # WISHLIST
  # ============================================================
  /api/wishlist/{coinId}:
    post:
      tags: [Wishlist]
      summary: Add a coin to the wishlist
      description: Also follows the coin and syncs legacy following list.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: coinId, in: path, required: true, schema: { type: string } }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties: { message: { type: string, example: "Coin added to wishlist" } }
        '400': { description: Coin not found }
    delete:
      tags: [Wishlist]
      summary: Remove a coin from the wishlist
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: coinId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties: { message: { type: string, example: "Coin removed from wishlist" } }
        '404': { description: Not found }

  /api/wishlist:
    get:
      tags: [Wishlist]
      summary: Get the current user's wishlist
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          coins:
                            type: array
                            items: { $ref: '#/components/schemas/WishlistCoin' }

  # ============================================================
  # REWARDS
  # ============================================================
  /api/rewards:
    get:
      tags: [Rewards]
      summary: Get reward summary
      description: Returns total points and the last 50 reward activities.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/RewardsSummary' } }

  /api/rewards/claim:
    post:
      tags: [Rewards]
      summary: Claim a reward for an action
      description: >
        Actions: DAILY_LOGIN, ADD_WISHLIST, FOLLOW_COIN, READ_NEWS. DAILY_LOGIN is capped once per day.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [DAILY_LOGIN, ADD_WISHLIST, FOLLOW_COIN, READ_NEWS] }
      responses:
        '200':
          description: Reward claimed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message: { type: string }
                          points: { type: integer }
        '400': { description: "Action is required / Invalid reward action / Daily login reward already claimed today" }

  # ============================================================
  # NEWS
  # ============================================================
  /api/news/store-news:
    post:
      tags: [News]
      summary: Trigger news ingestion pipeline
      description: Fetches from upstream, dedupes, derives related coins, and stores articles.
      security: [{ ingestKey: [] }]
      responses:
        '200':
          description: Ingestion result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/StoreNewsResult' } }
        '401': { description: Missing/mismatched ingest key }
        '501': { description: Ingestion not configured }

  /api/news/sentiment/trending:
    get:
      tags: [News]
      summary: Trending coin sentiment
      description: Cached snapshot of top bullish/bearish coins by sentiment.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          generatedAt: { type: string, nullable: true }
                          revision: { type: integer }
                          topBullish: { type: array, items: { type: object } }
                          topBearish: { type: array, items: { type: object } }
        '503': { description: Sentiment API disabled }

  /api/news/sentiment/{symbol}:
    get:
      tags: [News]
      summary: Coin sentiment snapshot
      parameters:
        - { name: symbol, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          symbol: { type: string }
                          weightedScore: { type: number }
                          normalizedScore: { type: number }
                          confidence: { type: number }
                          articleCount: { type: integer }
                          bullishRatio: { type: number }
                          bearishRatio: { type: number }
                          riskRatio: { type: number }
                          computedAt: { type: string }
                          revision: { type: integer }
                          topHeadlines:
                            type: array
                            items:
                              type: object
                              properties:
                                externalId: { type: string }
                                title: { type: string }
                                score: { type: number }
                                publishedAt: { type: string }
        '400': { description: symbol required }
        '503': { description: Sentiment API disabled }

  /api/news:
    get:
      tags: [News]
      summary: Paginated news feed
      description: >
        Supports coin filtering (filterby=coin&coinid=X). Response is ETag/Redis cached and
        translated to the resolved request language. Excludes coins the user already follows.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { name: filterby, in: query, required: false, schema: { type: string, example: coin } }
        - { name: coinid, in: query, required: false, schema: { type: string } }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50 } }
        - { name: categories, in: query, required: false, schema: { type: string }, description: "CSV of BTC/ETH/FIAT/MARKET/CRYPTOCURRENCY" }
      responses:
        '200':
          description: OK (ETag cached)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          news:
                            type: array
                            items: { $ref: '#/components/schemas/NewsArticle' }
        '304': { description: Not modified (ETag match) }

  /api/news/following:
    get:
      tags: [News]
      summary: Personalized feed from followed coins/users
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50 } }
        - { name: mode, in: query, required: false, schema: { type: string, enum: [all, coin, users], default: all } }
        - { name: categories, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          news:
                            type: array
                            items:
                              allOf:
                                - $ref: '#/components/schemas/NewsArticle'
                                - type: object
                                  properties:
                                    origin: { type: string, enum: [coin, user, both] }
        '401': { description: Unauthenticated }
        '403': { description: Email not verified }

  /api/news/{newsId}:
    get:
      tags: [News]
      summary: Get article detail
      description: DB first, falls back to CoinDesk API; emits an article_viewed analytics event.
      parameters:
        - { name: newsId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties: { news: { $ref: '#/components/schemas/NewsArticle' } }
        '404': { description: News not found }

  # ============================================================
  # NEWSBOARDS
  # ============================================================
  /api/newsboards:
    get:
      tags: [NewsBoards]
      summary: List the current user's boards
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          boards:
                            type: array
                            items: { $ref: '#/components/schemas/NewsBoard' }
    post:
      tags: [NewsBoards]
      summary: Create a board
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: { name: { type: string } }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties: { board: { $ref: '#/components/schemas/NewsBoard' } }
        '400': { description: "Board name is required / duplicate name" }

  /api/newsboards/{boardId}/news:
    get:
      tags: [NewsBoards]
      summary: Get full article details for news saved in a board
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: boardId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          news:
                            type: array
                            items: { $ref: '#/components/schemas/NewsArticle' }
        '404': { description: Board not found }

  /api/newsboards/{boardId}/items:
    post:
      tags: [NewsBoards]
      summary: Save an article to a board
      description: Increments the article's global save counter only on the user's first save anywhere.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: boardId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newsId]
              properties: { newsId: { type: string } }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          saveCount: { type: integer }
                          boardId: { type: string }
        '400': { description: "newsId is required / Board not found" }

  /api/newsboards/{boardId}/items/{newsId}:
    delete:
      tags: [NewsBoards]
      summary: Remove an article from a board
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: boardId, in: path, required: true, schema: { type: string } }
        - { name: newsId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties: { saveCount: { type: integer } }
        '400': { description: Board not found }

  # ============================================================
  # COMMENTS
  # ============================================================
  /api/news/{newsId}/comments:
    get:
      tags: [Comments]
      summary: List top-level comments for an article
      parameters:
        - { name: newsId, in: path, required: true, schema: { type: string } }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          comments:
                            type: array
                            items: { $ref: '#/components/schemas/Comment' }
    post:
      tags: [Comments]
      summary: Add a comment or reply
      description: >
        Extracts and resolves @username mentions, increments article comment counter, and fires a
        comment-reply notification when replying to someone else.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: newsId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 500 }
                parentId: { type: string, description: Optional comment id to reply to }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          comment: { $ref: '#/components/schemas/Comment' }
                          commentCount: { type: integer }
        '400': { description: "Empty body / body too long / does not belong to this article" }
        '404': { description: User or parent comment not found }

  /api/news/{newsId}/comments/{commentId}/replies:
    get:
      tags: [Comments]
      summary: List replies to a comment
      parameters:
        - { name: newsId, in: path, required: true, schema: { type: string } }
        - { name: commentId, in: path, required: true, schema: { type: string } }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 10 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          replies:
                            type: array
                            items: { $ref: '#/components/schemas/Comment' }

  /api/news/{newsId}/comments/{commentId}:
    delete:
      tags: [Comments]
      summary: Delete own comment
      description: Soft-deletes if it has replies (keeps thread intact), otherwise hard-deletes.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: newsId, in: path, required: true, schema: { type: string } }
        - { name: commentId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties: { commentCount: { type: integer } }
        '403': { description: Not authorized to delete this comment }
        '404': { description: Comment not found }

  # ============================================================
  # REACTIONS
  # ============================================================
  /api/news/{newsId}/reactions:
    put:
      tags: [Reactions]
      summary: Set/toggle the caller's reaction on an article
      description: >
        Re-submitting the same type removes it; a different type switches it. One reaction per user
        per article. Awards 1 reward point in the background on a new reaction.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: newsId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { $ref: '#/components/schemas/ReactionType' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          userReaction: { $ref: '#/components/schemas/ReactionType' }
                          reactions: { $ref: '#/components/schemas/ReactionCounts' }
        '400': { description: Invalid reaction type }
    delete:
      tags: [Reactions]
      summary: Remove the caller's reaction
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: newsId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          userReaction: { nullable: true, type: string }
                          reactions: { $ref: '#/components/schemas/ReactionCounts' }
    get:
      tags: [Reactions]
      summary: Get reaction counts (and caller's own reaction if authenticated)
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { name: newsId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          userReaction: { nullable: true, type: string }
                          reactions: { $ref: '#/components/schemas/ReactionCounts' }

  /api/news/{newsId}/reactions/users:
    get:
      tags: [Reactions]
      summary: List users who reacted with a given type
      description: No auth middleware applied (public), unlike the other reaction endpoints.
      parameters:
        - { name: newsId, in: path, required: true, schema: { type: string } }
        - { name: type, in: query, required: true, schema: { $ref: '#/components/schemas/ReactionType' } }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          users:
                            type: array
                            items:
                              type: object
                              properties:
                                userId: { type: string }
                                username: { type: string }
                                reactedAt: { type: string, format: date-time }
        '400': { description: "Query param 'type' is required and must be a valid reaction type" }

  # ============================================================
  # SEARCH
  # ============================================================
  /api/search:
    get:
      tags: [Search]
      summary: Unified cross-entity search
      description: >
        Searches coins, news, users, newsBoards and portfolioAssets in parallel with per-segment
        timeout budgets and 30s Redis caching. Personalized segments (newsBoards, portfolioAssets)
        only populate when authenticated.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 64 } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 8, minimum: 1, maximum: 25 } }
        - { name: segments, in: query, required: false, schema: { type: string }, description: "CSV of all|coins|news|users|newsBoards|portfolioAssets" }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/UnifiedSearchResult' } }
        '400': { description: Invalid query length }

  # ============================================================
  # COINS
  # ============================================================
  /api/coins/batch:
    get:
      tags: [Coins]
      summary: Batch-resolve coin market data
      parameters:
        - { name: ids, in: query, required: false, schema: { type: string }, description: CSV of symbols/CoinGecko ids }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          coins:
                            type: array
                            items: { $ref: '#/components/schemas/CoinProfile' }

  /api/coins/create-collections:
    post:
      tags: [Coins]
      summary: Run full coin ingestion from exchange providers
      description: >
        Ingests from Binance/Bybit/Coinbase/OKX, builds exchange_listed_assets, upserts
        coin_news_tagging_map, and syncs CoinMaster. No auth middleware is applied (internal/cron use).
      responses:
        '200':
          description: Ingestion result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/IngestResult' } }

  /api/coins/populate-labeled-coins:
    post:
      tags: [Coins]
      summary: Populate LabeledCoin collection
      description: Merges CoinGecko coin list with exchange-listed data. No auth middleware applied.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties: { count: { type: integer }, success: { type: boolean } }

  /api/coins/populate-active-coins:
    post:
      tags: [Coins]
      summary: Populate LabeledActiveCoin snapshot (one CoinGecko markets page)
      description: No auth middleware applied.
      parameters:
        - { name: page, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 35 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties: { count: { type: integer }, success: { type: boolean }, page: { type: integer } }
        '400': { description: "page is required and must be between 1 and 35" }

  /api/coins/populate-cmc-labeled-coins:
    post:
      tags: [Coins]
      summary: Populate CmcLabeledCoin collection (one CoinMarketCap page)
      description: No auth middleware applied.
      parameters:
        - { name: start, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 8701 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties: { count: { type: integer }, success: { type: boolean }, start: { type: integer } }
        '400': { description: "start is required and must be between 1 and 8701" }

  /api/coins/{coinId}/stats:
    get:
      tags: [Coins]
      summary: Get detailed market stats for a coin
      description: Cached 45s.
      parameters:
        - { name: coinId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties: { stats: { $ref: '#/components/schemas/CoinStats' } }
        '404': { description: Stats not found for this coin }

  /api/coins/{coinId}:
    get:
      tags: [Coins]
      summary: Get a coin's profile/market data
      description: >
        Resolution order: FilteredCoin -> local LabeledActiveCoin snapshot -> local DB -> CoinGecko API
        -> snapshot fallback. Cached 45s.
      parameters:
        - { name: coinId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties: { coin: { $ref: '#/components/schemas/CoinProfile' } }
        '404': { description: Coin not found }

  /api/coins/{coinId}/news:
    get:
      tags: [Coins]
      summary: Get news related to a coin
      description: Queries by symbol first, falls back to CoinDesk ticker search if none found. Cached 105s.
      parameters:
        - { name: coinId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          news:
                            type: array
                            items: { $ref: '#/components/schemas/NewsArticle' }

  # ============================================================
  # MARKET
  # ============================================================
  /api/market/snapshot:
    get:
      tags: [Market]
      summary: Precomputed market snapshot (trending / gainers / losers with sparklines)
      description: Redis-only, supports conditional GET via ETag.
      parameters:
        - { name: If-None-Match, in: header, required: false, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/MarketSnapshotV2' } }
        '304': { description: Not modified }
        '503': { description: Snapshot not ready yet (Retry-After header set) }

  /api/market/analysis:
    get:
      tags: [Market]
      summary: Coins ranked by heuristic signals (momentum / breakout / volatile)
      description: Includes a "why moving" news headline where available. Cached 120s.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          generatedAt: { type: string }
                          coins:
                            type: array
                            items:
                              allOf:
                                - $ref: '#/components/schemas/CoinProfile'
                                - type: object
                                  properties:
                                    signals:
                                      type: array
                                      items:
                                        type: object
                                        properties:
                                          type: { type: string, enum: [momentum, breakout, volatile] }
                                          label: { type: string }
                                          severity: { type: string, enum: [positive, warning] }
                                    whyMoving: { type: string, nullable: true }

  /api/market/trending:
    get:
      tags: [Market]
      summary: Top 20 trending coins
      description: From CoinMarketCap, cached 120s with DB fallback.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          coins:
                            type: array
                            items: { $ref: '#/components/schemas/CoinProfile' }

  /api/market/top-gainers:
    get:
      tags: [Market]
      summary: Top 10 24h gainers
      description: Cached 120s with DB fallback.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          coins:
                            type: array
                            items: { $ref: '#/components/schemas/CoinProfile' }

  /api/market/top-losers:
    get:
      tags: [Market]
      summary: Top 10 24h losers
      description: Cached 120s with DB fallback.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          coins:
                            type: array
                            items: { $ref: '#/components/schemas/CoinProfile' }

  /api/market/active-coins:
    get:
      tags: [Market]
      summary: Cursor-paginated list of labeled active coins
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 20, minimum: 1, maximum: 50 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          coins:
                            type: array
                            items: { $ref: '#/components/schemas/CoinProfile' }
                          nextCursor: { type: integer, nullable: true }
        '400': { description: "Invalid cursor / Limit must be between 1 and 50" }

  # ============================================================
  # CHARTS
  # ============================================================
  /api/charts/klines:
    get:
      tags: [Charts]
      summary: Get OHLCV klines
      description: >
        Reads from stored candles, falling back to trade-aggregation then live Binance REST if no
        stored data exists. Response is a raw array (not the standard envelope).
      parameters:
        - { name: symbol, in: query, required: true, schema: { type: string } }
        - { name: interval, in: query, required: false, schema: { $ref: '#/components/schemas/KlineInterval' }, description: Default 1h }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: exchange, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 1000, maximum: 2000 } }
        - { name: fields, in: query, required: false, schema: { type: string, enum: [minimal, ohlcv] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/KlineRecord' }
        '400': { description: "symbol is required / invalid interval" }
        '503': { description: MongoDB timeout }

  /api/charts/market-trend:
    get:
      tags: [Charts]
      summary: Market-cap-weighted trend index (legacy/V2 dispatch)
      description: Delegates to the batched-aggregation V2 implementation when enabled by config.
      parameters:
        - { name: interval, in: query, required: false, schema: { $ref: '#/components/schemas/KlineInterval' }, description: Default 1m }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: exchange, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 240, minimum: 30, maximum: 720 } }
        - { name: maxCoins, in: query, required: false, schema: { type: integer, default: 25, minimum: 5, maximum: 100 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketTrendResponse' }
        '400': { description: Invalid interval }

  /api/charts/market-trend-v2:
    get:
      tags: [Charts]
      summary: Market-cap-weighted trend index (always uses batched aggregation)
      parameters:
        - { name: interval, in: query, required: false, schema: { $ref: '#/components/schemas/KlineInterval' } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: exchange, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 240, minimum: 30, maximum: 720 } }
        - { name: maxCoins, in: query, required: false, schema: { type: integer, default: 25, minimum: 5, maximum: 100 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketTrendResponse' }
        '400': { description: Invalid interval }

  /api/charts/market-trend-ohlc:
    get:
      tags: [Charts]
      summary: OHLC (candlestick) view of the market-cap index
      parameters:
        - { name: interval, in: query, required: false, schema: { $ref: '#/components/schemas/KlineInterval' } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: exchange, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 240, minimum: 30, maximum: 720 } }
        - { name: maxCoins, in: query, required: false, schema: { type: integer, default: 25, minimum: 5, maximum: 100 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  points:
                    type: array
                    items:
                      type: object
                      properties:
                        openTime: { type: string, format: date-time }
                        open: { type: number }
                        high: { type: number }
                        low: { type: number }
                        close: { type: number }
                  latestValue: { type: number }
                  absoluteChange24h: { type: number }
                  relativeChange24h: { type: number }
                  range:
                    type: object
                    properties:
                      interval: { type: string }
                      from: { type: string, format: date-time }
                      to: { type: string, format: date-time }
                      limit: { type: integer }
                  constituents: { type: integer }
        '400': { description: Invalid interval }

  /api/charts/trades:
    get:
      tags: [Charts]
      summary: Raw trade ticks for a symbol
      description: Internally queried as aggTrade dataType (same as /aggTrades).
      parameters:
        - { name: symbol, in: query, required: true, schema: { type: string } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: exchange, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 1000, maximum: 2000 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TradeRecord' }
        '400': { description: symbol is required }

  /api/charts/aggTrades:
    get:
      tags: [Charts]
      summary: Aggregated trade ticks for a symbol
      parameters:
        - { name: symbol, in: query, required: true, schema: { type: string } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: exchange, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 1000, maximum: 2000 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TradeRecord' }
        '400': { description: symbol is required }

  # ============================================================
  # PORTFOLIO
  # ============================================================
  /api/portfolio/chains:
    get:
      tags: [Portfolio]
      summary: List supported wallet chains
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          chains:
                            type: array
                            items: { $ref: '#/components/schemas/PortfolioChain' }

  /api/portfolio/wallets:
    get:
      tags: [Portfolio]
      summary: List tracked wallets
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          wallets:
                            type: array
                            items: { $ref: '#/components/schemas/Wallet' }
    post:
      tags: [Portfolio]
      summary: Add a wallet for tracking
      description: >
        Validates chain selection, normalizes and dedupes the address globally, invalidates cached
        holdings, triggers a portfolio-intelligence recompute (trigger=wallet_change), and (if
        provider subscription writes are allowed) registers Alchemy/Zerion webhook subscriptions.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, chains]
              properties:
                address: { type: string }
                chains: { type: array, items: { type: string } }
                label: { type: string }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties: { wallet: { $ref: '#/components/schemas/Wallet' } }
        '400': { description: "Missing fields / Wallet already added / already monitored by another user" }

  /api/portfolio/wallets/{id}:
    delete:
      tags: [Portfolio]
      summary: Remove a tracked wallet
      description: Deregisters Alchemy/Zerion subscriptions and deletes cached holdings.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties: { message: { type: string, example: "Wallet removed" } }
        '404': { description: Wallet not found }

  /api/portfolio/events:
    get:
      tags: [Portfolio]
      summary: Paginated wallet activity events
      description: >
        Header-derived request context (X-Portfolio-Session-Mode, X-Portfolio-Trigger-Reason) gates
        freshness on page 1.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 20 } }
        - { name: X-Portfolio-Session-Mode, in: header, required: false, schema: { type: string } }
        - { name: X-Portfolio-Trigger-Reason, in: header, required: false, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          events:
                            type: array
                            items: { $ref: '#/components/schemas/WalletEvent' }
        '409': { description: "PORTFOLIO_API_BLOCKED - stream-owned live session" }

  /api/portfolio/events/refresh-status:
    post:
      tags: [Portfolio]
      summary: Refresh pending transaction statuses
      description: Scans up to 200 events needing a status refresh via Alchemy getTransactionReceipt.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties: { updated: { type: integer } }
        '409': { description: PORTFOLIO_API_BLOCKED }

  /api/portfolio/holdings:
    get:
      tags: [Portfolio]
      summary: Get merged wallet + exchange holdings
      description: >
        Uses a cached read-model unless refresh=1/true, otherwise rebuilds, upserts, enqueues a PI
        recompute, and broadcasts a holdings delta over WebSocket.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: refresh, in: query, required: false, schema: { type: string, enum: ['1', 'true'] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties: { holdings: { $ref: '#/components/schemas/Holdings' } }
        '409': { description: PORTFOLIO_API_BLOCKED }

  /api/portfolio/exchanges:
    get:
      tags: [Portfolio]
      summary: List linked exchange connections
      description: Gated by config.exchangePortfolioEnabled.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          exchanges:
                            type: array
                            items: { $ref: '#/components/schemas/ExchangeConnection' }
        '404': { description: Feature disabled }

  /api/portfolio/exchanges/coindcx/validate:
    post:
      tags: [Portfolio]
      summary: Validate CoinDCX credentials without persisting
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [apiKey, apiSecret]
              properties:
                apiKey: { type: string }
                apiSecret: { type: string }
      responses:
        '200':
          description: Valid
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { type: object, properties: { ok: { type: boolean, example: true } } }
        '400': { description: Missing fields or invalid credentials }
        '404': { description: Feature disabled }

  /api/portfolio/exchanges/coindcx:
    post:
      tags: [Portfolio]
      summary: Link a CoinDCX account
      description: Validates credentials, enforces max connections per user, encrypts and persists.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [apiKey, apiSecret]
              properties:
                apiKey: { type: string }
                apiSecret: { type: string }
                label: { type: string }
      responses:
        '201':
          description: Linked
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties: { exchange: { $ref: '#/components/schemas/ExchangeConnection' } }
        '400': { description: "Missing fields / invalid credentials / max connections reached" }
        '404': { description: Feature disabled }

  /api/portfolio/exchanges/coindcx/{id}:
    patch:
      tags: [Portfolio]
      summary: Rotate credentials on an existing CoinDCX connection
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [apiKey, apiSecret]
              properties:
                apiKey: { type: string }
                apiSecret: { type: string }
                label: { type: string }
      responses:
        '200':
          description: Rotated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties: { exchange: { $ref: '#/components/schemas/ExchangeConnection' } }
        '404': { description: "Exchange connection not found / feature disabled" }

  /api/portfolio/exchanges/{id}:
    delete:
      tags: [Portfolio]
      summary: Remove an exchange connection
      description: Deletes its exchange-sourced events and invalidates the holdings cache.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties: { eventsRemoved: { type: integer } }
        '404': { description: "Not found / feature disabled" }

  /api/portfolio/webhooks/alchemy:
    post:
      tags: [Portfolio]
      summary: Alchemy Address Activity webhook receiver
      description: >
        Unauthenticated route (HMAC-SHA256 verified internally against the raw body via the
        X-Alchemy-Signature header). Always responds 200 immediately (Alchemy retries on non-200);
        processing (signature verification, event matching, ingestion) happens asynchronously.
      parameters:
        - { name: X-Alchemy-Signature, in: header, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object, description: "Alchemy webhook payload: { type, event: { network, activity: [...] } }" }
      responses:
        '200':
          description: Always acknowledges receipt
          content:
            text/plain:
              schema: { type: string, example: ok }

  /api/portfolio/webhooks/zerion:
    post:
      tags: [Portfolio]
      summary: Zerion transaction-subscription webhook receiver
      description: >
        Unauthenticated route (verified internally via X-Certificate-URL/X-Timestamp/X-Signature
        headers). Always responds 200 immediately; processing happens asynchronously.
      requestBody:
        content:
          application/json:
            schema: { type: object, description: "Zerion webhook payload" }
      responses:
        '200':
          description: Always acknowledges receipt
          content:
            text/plain:
              schema: { type: string, example: ok }

  # ============================================================
  # PORTFOLIO INTELLIGENCE
  # ============================================================
  /api/portfolio/intelligence/context:
    get:
      tags: [Portfolio Intelligence]
      summary: Feed-personalization context
      description: >
        Lightweight held-symbols/weights context for feed personalization. Respects the
        personalization_globally_disabled runtime switch and per-user opt-out.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/PortfolioFeedContext' } }
        '403': { description: Feature disabled }

  /api/portfolio/intelligence/snapshot/latest:
    get:
      tags: [Portfolio Intelligence]
      summary: Latest analytics snapshot
      description: Full v2 payload if computed, else an empty shell {metrics:{}, insights:[]}.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          manifest: { $ref: '#/components/schemas/PiManifest' }
                          payload: { type: object, description: PortfolioAnalyticsPayloadV2 or an empty shell }
        '403': { description: Feature disabled }

  /api/portfolio/intelligence/summary:
    get:
      tags: [Portfolio Intelligence]
      summary: Condensed portfolio-intelligence summary
      description: >
        If no cached analytics exist, attempts a synchronous compute (Redis lock, 60s), falling back
        to a pending placeholder if compute isn't possible.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          healthScore: { type: number, nullable: true }
                          healthLabel: { type: string }
                          riskScore: { type: number }
                          riskLabel: { type: string }
                          identity: { type: object, properties: { id: { type: string }, name: { type: string }, confidence: { type: number } } }
                          topCategory: { type: object, properties: { id: { type: string }, name: { type: string }, pct: { type: number } } }
                          partial: { type: boolean }
                          analyticsRevision: { type: integer }
                          pending: { type: boolean }
        '403': { description: Feature disabled }

  /api/portfolio/intelligence/insights:
    get:
      tags: [Portfolio Intelligence]
      summary: Generated insight cards
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          insights: { type: array, items: { $ref: '#/components/schemas/Insight' } }
                          partial: { type: boolean }
        '403': { description: Feature disabled }

  /api/portfolio/intelligence/recompute:
    post:
      tags: [Portfolio Intelligence]
      summary: Manually enqueue a recompute
      description: High-priority, debounce-bypassing manual recompute. May be a no-op if disabled or backpressured.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { type: object, properties: { enqueued: { type: boolean } } }
        '403': { description: Feature disabled }

  /api/portfolio/intelligence/health:
    get:
      tags: [Portfolio Intelligence]
      summary: Health-score breakdown slice
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          healthScore: { type: number, nullable: true }
                          healthLabel: { type: string }
                          breakdown:
                            type: object
                            properties:
                              risk: { type: number }
                              diversification: { type: number }
                              concentration: { type: number }
                              stablecoin: { type: number }
                          explain:
                            type: object
                            properties:
                              weights: { type: object, additionalProperties: { type: number } }
                              subScores: { type: object, additionalProperties: { type: number } }
        '403': { description: Feature disabled }
        '404': { description: No analytics available }

  /api/portfolio/intelligence/risk:
    get:
      tags: [Portfolio Intelligence]
      summary: Weighted risk-score slice
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          riskScore: { type: number }
                          riskLabel: { type: string }
                          contributions:
                            type: array
                            items:
                              type: object
                              properties:
                                categoryId: { type: string }
                                weightPct: { type: number }
                                riskWeight: { type: number }
                                contribution: { type: number }
                          explain: { type: object, properties: { formula: { type: string } } }
        '403': { description: Feature disabled }
        '404': { description: No analytics available }

  /api/portfolio/intelligence/allocation:
    get:
      tags: [Portfolio Intelligence]
      summary: Category allocation slice
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          byCategory: { type: object, additionalProperties: { type: number } }
                          topCategory: { type: object, properties: { id: { type: string }, name: { type: string }, pct: { type: number } } }
                          categoryCount: { type: integer }
                          catalogVersion: { type: integer }
                          explain:
                            type: object
                            properties:
                              eligibleCount: { type: integer }
