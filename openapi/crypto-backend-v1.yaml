  # ============================================================
  # FEED RANKING
  # ============================================================
  /api/feed/ranked:
    get:
      tags: [Feed Ranking]
      summary: Read back a previously ranked article list
      description: Reads from a Redis sorted set populated by a prior POST; does not recompute.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: mode, in: query, required: false, schema: { type: string, default: following } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          ranked:
                            type: array
                            items:
                              type: object
                              properties: { articleId: { type: string }, score: { type: number } }
                          mode: { type: string }
        '403': { description: Feature disabled }
    post:
      tags: [Feed Ranking]
      summary: Score and rank a batch of articles
      description: >
        Scores articles against the user's portfolio-intelligence feed context (held symbols,
        narrative/conviction vectors, identity, recency decay) and persists the top `limit` results
        into a Redis sorted set (1hr TTL) for subsequent GET calls.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [articles]
              properties:
                limit: { type: integer, default: 50, maximum: 200 }
                mode: { type: string }
                articles:
                  type: array
                  items:
                    type: object
                    required: [articleId, symbols, categories]
                    properties:
                      articleId: { type: string }
                      symbols: { type: array, items: { type: string } }
                      categories: { type: array, items: { type: string } }
                      publishedAt: { type: string, format: date-time }
                      reactionCount: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          ranked:
                            type: array
                            items:
                              type: object
                              properties: { articleId: { type: string }, score: { type: number } }
                          mode: { type: string }
        '403': { description: Feature disabled }

