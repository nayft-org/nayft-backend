# Local / compose stack: Redis + MongoDB + API + stream worker (fan-out).
# Build image: docker compose build backend
# Run: docker compose up -d
#
# Fan-out: `backend` serves HTTP/WebSocket; `stream-worker` runs Binance ticker + kline/aggTrade
# and publishes prices to Redis (`stream:prices:batch`). Both need Redis + Mongo — scale API replicas,
# keep a single stream-worker unless you operate multiple isolated deployments.
#
# From containers: redis://redis:6379 and mongodb://mongodb:27017/crypto_db
# (overridden below so in-network hostnames work; .env may still supply API keys).
#
# Explicit default network name keeps the stack stable across `compose down` / `up` on self-hosted runners.

networks:
  default:
    name: nayft-backend_default

services:
  redis:
    image: redis:7-alpine
    container_name: crypto-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  mongodb:
    image: mongo:7
    container_name: crypto-mongo
    ports:
      - "27020:27017"
    volumes:
      - mongodb:/data/db
    environment:
      MONGO_INITDB_DATABASE: crypto_db
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  backend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    image: nayft-backend:local
    container_name: crypto-backend
    ports:
      - "4001:4001"
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      MONGO_URI: mongodb://mongodb:27017/crypto_db
    depends_on:
      - redis
      - mongodb
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Same image as backend; different CMD — Binance → Redis pub/sub + Mongo klines/trades.
  stream-worker:
    profiles: ["app"]
    image: nayft-backend:local
    container_name: crypto-stream-worker
    command: ["node", "dist/workers/streamIngestion.js"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      MONGO_URI: mongodb://mongodb:27017/crypto_db
    depends_on:
      redis:
        condition: service_started
      mongodb:
        condition: service_started
      backend:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:
  mongodb: