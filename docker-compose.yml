# Local infrastructure only: Redis + MongoDB (no API or workers in Docker).
# Run the backend on the host: `npm run dev` (or your usual command).
#
# Start:  docker compose up -d
# Stop:   docker compose down
# Logs:   docker compose logs -f
#
# From the host machine (Node on your laptop), use:
#   REDIS_URL=redis://127.0.0.1:6379
#   MONGO_URI=mongodb://127.0.0.1:27018/crypto_db
# (Port 27018 avoids clashing with another MongoDB on the default 27017.)
#
# Full containerized stack (API + stream-worker) was split out; build/run those
# from Dockerfile separately or add a compose override if you need them again.

networks:
  default:
    name: nayft-backend_default

services:
  redis:
    image: redis:7-alpine
    container_name: crypto-redis
    ports:
      - "6377:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  mongodb:
    image: mongo:7
    container_name: crypto-mongo
    ports:
      - "27020:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: crypto_db
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  redis_data:
  mongo_data:
