# Local / compose stack: Redis + MongoDB + API image.
# Build image: docker compose build backend
# Run: docker compose up -d
#
# From the backend container: redis://redis:6379 and mongodb://mongodb:27017/crypto_db
# (overridden below so in-network hostnames work; .env may still supply API keys).
#
# Explicit default network name keeps the stack stable across `compose down` / `up` on self-hosted runners.

networks:
  default:
    name: nayft-backend_default

services:
  redis:
    image: redis:7-alpine
    container_name: crypto-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  mongodb:
    image: mongo:7
    container_name: crypto-mongo
    ports:
      - "27018:27017"
    volumes:
      - /nayft_storage/mongodb:/data/db
    environment:
      MONGO_INITDB_DATABASE: crypto_db
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto-backend
    ports:
      - "4001:4001"
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      MONGO_URI: mongodb://mongodb:27017/crypto_db
    depends_on:
      - redis
      - mongodb
    restart: unless-stopped

volumes:
  redis_data:
  mongo_data:
