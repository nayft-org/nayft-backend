# Local / compose stack: Redis + API image.
# Build image: docker compose build backend
# Run: docker compose up -d
#
# From inside the backend container, use redis://redis:6379 (set below).
# MongoDB must reach a host the container can see, e.g. mongodb://host.docker.internal:27017/crypto_db
# (extra_hosts below enables host.docker.internal on Linux).
#
# Explicit default network name keeps the stack stable across `compose down` / `up` on self-hosted runners.

networks:
  default:
    name: nayft-backend_default

services:
  redis:
    image: redis:7-alpine
    container_name: crypto-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: nayft-backend:latest
    container_name: nayft-backend
    ports:
      - "4001:4001"
    environment:
      REDIS_URL: redis://redis:6379
      # OHLCV CSV archival (set on host via .env). Maps to named volume below.
      OHLCV_ARCHIVE_ROOT: /app/data
    env_file:
      - path: .env
        required: false
    depends_on:
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    volumes:
      # Persist OHLCV CSV archives. On the VM, replace with a bind mount, e.g.
      #   - /home/ubuntu/ohlcv_data:/app/data
      # and ensure that directory is writable by the container user (uid 1000 / node).
      - /home/ubuntu/ohlcv_data:/app/data

volumes:
  redis_data:
  ohlcv_archive:
